<div class="shell">
  <app-admin-sidebar></app-admin-sidebar>

  <div class="main-wrap">
    <app-admin-header></app-admin-header>

    <div class="content">

      <!-- Stat Cards -->
      <div class="stat-grid">
        <div class="quest-stat-card" *ngFor="let stat of stats">
          <div class="qsc-icon" [innerHTML]="stat.icon"></div>
          <span class="qsc-label">{{ stat.label }}</span>
          <span class="qsc-value">{{ stat.value }}</span>
        </div>
      </div>

      <!-- Manage Quest Filter -->
      <app-quest-filter
        (searchChange)="onSearchChange($event)"
        (statusChange)="onStatusChange($event)"
        (filterClick)="applyFilter()">
      </app-quest-filter>

      <!-- Quest Table -->
      <app-quest-table [quests]="filteredQuests"></app-quest-table>

    </div>

    <app-footer></app-footer>
  </div>
</div>
