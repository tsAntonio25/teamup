<div class="table-wrapper">
  <table class="users-table">
    <thead>
      <tr class="table-header-row">
        <th>QUESTS NAME</th>
        <th>CLIENT</th>
        <th>ASSIGNED PARTY</th>
        <th>STATUS</th>
        <th>POSTED</th>
      </tr>
    </thead>
    <tbody>
      <tr class="table-row" *ngFor="let quest of quests; let i = index" [class.alt]="i % 2 !== 0">
        <td class="quest-name-cell">{{ quest.name }}</td>
        <td>{{ quest.client }}</td>
        <td>{{ quest.assignedParty }}</td>
        <td>
          <span class="status-badge" [ngClass]="{
            'status-pending':     quest.status === 'Pending',
            'status-in-progress': quest.status === 'In Progress',
            'status-completed':   quest.status === 'Completed'
          }">{{ quest.status }}</span>
        </td>
        <td class="posted-cell">{{ quest.posted }}</td>
      </tr>
    </tbody>
  </table>
</div>
