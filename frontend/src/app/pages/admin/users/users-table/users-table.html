<div class="table-wrapper">
  <table class="users-table">
    <thead>
      <tr class="table-header-row">
        <th>NAME</th>
        <th>ROLE</th>
        <th>EMAIL</th>
        <th>LEVEL</th>
        <th>RANK</th>
        <th>STATUS</th>
      </tr>
    </thead>
    <tbody>
      <tr class="table-row" *ngFor="let user of users; let i = index" [class.alt]="i % 2 !== 0">
        <td class="name-cell">
          <div class="user-avatar">{{ getInitials(user.name) }}</div>
          <span>{{ user.name }}</span>
        </td>
        <td>
          <span class="role-badge" [ngClass]="user.role === 'Freelancer' ? 'role-freelancer' : 'role-client'">
            {{ user.role }}
          </span>
        </td>
        <td class="email-cell">{{ user.email }}</td>
        <td class="level-cell">{{ user.level ?? '' }}</td>
        <td>
          <span *ngIf="user.rank" class="rank-badge" [ngClass]="'rank-' + user.rank.toLowerCase()">
            {{ user.rank }}
          </span>
        </td>
        <td>
          <span class="status-badge" [ngClass]="user.status === 'Active' ? 'status-active' : 'status-suspended'">
            {{ user.status }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
