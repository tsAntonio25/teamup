<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>NAME</th>
        <th>ROLE</th>
        <th>EMAIL</th>
        <th>LEVEL</th>
        <th>RANK</th>
        <th>STATUS</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users; track user.email; let i = $index) {
        <tr>
          <td>
            <div class="name-cell">
              <div class="user-avatar">{{ getInitials(user.name) }}</div>
              <span>{{ user.name }}</span>
            </div>
          </td>
          <td>
            <span class="role-badge" [class]="user.role === 'Freelancer' ? 'role-freelancer' : 'role-client'">
              {{ user.role }}
            </span>
          </td>
          <td class="email-cell">{{ user.email }}</td>
          <td class="level-cell">{{ user.level ?? '—' }}</td>
          <td>
            @if (user.rank) {
              <span class="rank-badge" [class]="'rank-' + user.rank.toLowerCase()">{{ user.rank }}</span>
            }
          </td>
          <td>
            <span class="status-badge" [class]="user.status === 'Active' ? 'status-active' : 'status-suspended'">
              {{ user.status }}
            </span>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
