<div class="shell">
  <app-admin-sidebar></app-admin-sidebar>

  <div class="main-wrap">
    <app-admin-header></app-admin-header>

    <div class="content">

      <div class="page-header">
        <p class="page-sub">Welcome back, Admin</p>
      </div>

      <!-- Stat Cards -->
      <div class="stat-grid">
        <div class="stat-card" *ngFor="let stat of stats">
          <div class="stat-icon">{{ stat.icon }}</div>
          <div class="stat-info">
            <p class="stat-label">{{ stat.label }}</p>
            <h3 class="stat-value">{{ stat.value }}</h3>
          </div>
        </div>
      </div>

      <!-- Charts Row -->
      <div class="charts-row">

        <!-- User Growth -->
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title">User Growth</span>
            <div class="chart-legend">
              <span class="legend-item"><span class="dot" style="background:#5B4FCF"></span>Freelancers</span>
              <span class="legend-item"><span class="dot" style="background:#E8457A"></span>Clients</span>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="growthChart"></canvas>
          </div>
        </div>

        <!-- Quest Status -->
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title">Quest Status</span>
            <div class="chart-legend">
              <span class="legend-item"><span class="dot" style="background:white"></span>Active</span>
              <span class="legend-item"><span class="dot" style="background:#5A2E9E"></span>Completed</span>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="questChart"></canvas>
          </div>
        </div>

      </div>

      <!-- Bottom Row -->
      <div class="bottom-row">

        <!-- Mini Stats -->
        <div class="mini-stats">
          <div class="mini-card" *ngFor="let mini of miniStats">
            <div class="mini-icon">{{ mini.icon }}</div>
            <div class="mini-info">
              <p class="mini-label">{{ mini.label }}</p>
              <h3 class="mini-value">{{ mini.value }}</h3>
            </div>
          </div>
        </div>

        <!-- Recent Activities -->
        <div class="activities-card">
          <h3 class="activities-title">Recent Activities</h3>
          <div class="activities-table-wrap">
            <table class="activities-table">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Activity</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let act of activities">
                  <td class="user-cell">
                    <span class="avatar">{{ act.initials }}</span>
                    {{ act.user }}
                  </td>
                  <td>{{ act.activity }}</td>
                  <td class="date-cell">{{ act.date }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>

    <app-footer></app-footer>
  </div>
</div>
